[tools]
node = "24"
python = "3.12"
gitleaks = "latest"
uv = "latest"

[tools."npm:markdownlint-cli2"]
version = "0.18"

[tasks.lint]
description = "Run all linters"
depends = ["lint:md", "lint:manifests"]

[tasks."lint:md"]
description = "Lint markdown files"
run = "npx markdownlint-cli2 '**/*.md' '#node_modules'"

[tasks."lint:md:changed"]
description = "Lint markdown in changed plugins and changed shared documents"
run = "uv run --no-project python tools/lint-markdown.py"

[tasks."test:lint-md-scope"]
description = "Test markdown lint change selection"
run = "uv run --no-project python -m unittest discover -s tools/tests -p test_lint_markdown.py"

[tasks."lint:manifests"]
description = "Validate all manifests and skill frontmatter"
run = "python3 tools/validate.py"

[tasks."lint:skill-parity"]
description = "Check plugin skills are in sync with canonical sources"
run = "python3 tools/sync-plugin-skills.py --check"

[tasks."lint:spec"]
description = "Validate Agent Plugins v1.0.0 conformance (plugins/)"
run = "uv run --with jsonschema --with pyyaml python tools/validate_spec.py"

[tasks.validate]
description = "Run all validation"
depends = ["lint:manifests", "lint:skill-parity", "lint:spec"]

[tasks.security]
description = "Run security scans"
run = "gitleaks detect --source . --verbose"

[tasks.build]
description = "Full build: lint + validate + security"
depends = ["lint", "validate", "security"]
