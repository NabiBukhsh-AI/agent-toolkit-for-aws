name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

# Cancel superseded PR runs; let push/merge_group runs complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to no permissions; grant minimally at the job level.
permissions:
  actions: none
  attestations: none
  checks: none
  contents: none
  deployments: none
  discussions: none
  id-token: none
  issues: none
  models: none
  packages: none
  pages: none
  pull-requests: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1

      - name: Test markdown lint scope
        run: mise run test:lint-md-scope

      - name: Lint markdown in changed scopes
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          LINT_HEAD: ${{ github.sha }}
        run: mise run lint:md:changed -- --base "$LINT_BASE" --head "$LINT_HEAD"

      - name: Lint markdown
        if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
        run: mise run lint:md

      - name: Validate manifests, skills, and plugin parity
        run: mise run validate

      - name: Security scan (gitleaks)
        run: mise run security
